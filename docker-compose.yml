services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rateuser
      RABBITMQ_DEFAULT_PASS: ratepass123
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: "amqp://rateuser:ratepass123@rabbitmq:5672/%2F"
      FLASK_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    command:
      - python
      - -c
      - "from workers.sync_worker import SyncWorker; SyncWorker().run()"
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: "amqp://rateuser:ratepass123@rabbitmq:5672/%2F"
      SYNC_BATCH_SIZE: "10"
      SYNC_FLUSH_INTERVAL_SECONDS: "2"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
